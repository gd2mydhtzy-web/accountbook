<style>
html{padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
/* 레이아웃: 한 화면 앱. 위 = 월 이동, 가운데 = 탭 내용(스크롤), 아래 = 고정 탭바. 웜 아이보리 단일 테마 */
:root{
  --bg:#F7F4EE; --card:#FDFBF7; --line:#E9E4DA; --line2:#DDD6C8;
  --ink:#1d1d1f; --sub:#8a857c; --faint:#B8B1A4;
  --inc:#0E9F55; --exp:#E5306B; --sav:#4F6FD1; --tithe:#B8892B;
  --exp2:#EC6A95; --exp3:#F294B5; --exp4:#F6B5CC; --exp5:#F9CEDD; --exp6:#FBE0E9; --exp7:#F3E9EC;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
html{height:100dvh}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.app{height:100%;display:flex;flex-direction:column}
.top{padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.top h1{font-size:21px;font-weight:600;margin:0;flex:1;letter-spacing:-.3px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink)}
.iconbtn:active{background:var(--line)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:.5px solid var(--line2);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--ink)}
.card{background:var(--card);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sum3>div{background:var(--card);border-radius:10px;padding:8px 10px;min-width:0}
.lbl{font-size:12px;color:var(--sub)}
.big{font-size:16px;font-weight:600;overflow:hidden;text-overflow:clip}
/* 달력 */
.cal{background:var(--card);border-radius:14px;padding:8px 4px 4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk{font-size:11px;color:var(--sub);text-align:center;padding:2px 0 6px}
.wk.sun{color:var(--exp)}
.day{min-height:60px;padding:4px 1px 3px;border-top:.5px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;overflow:hidden}
.day .d{font-size:12px;font-weight:500;min-width:22px;height:20px;line-height:20px;border-radius:6px;padding:0 4px}
.day.other .d{color:var(--faint)}
.day.today .d{box-shadow:inset 0 0 0 1px var(--ink)}
.day.sel .d{background:var(--ink);color:#fff}
.day .a{font-size:10.5px;line-height:1.3;letter-spacing:-.4px;max-width:100%}
.day .a.s{font-size:9.5px}
.day .a.xs{font-size:8.5px}
.inc{color:var(--inc)} .exp{color:var(--exp)} .sav{color:var(--sav)} .tit{color:var(--tithe)}
/* 내역 목록 */
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px}
.listhead b{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:.5px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:none}
.row .t{flex:1;min-width:0}
.row .t .n{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t .m{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-size:15px;font-weight:500}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.chev{color:var(--faint);font-size:18px;line-height:1}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:22px 8px;line-height:1.6}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(40,30,10,.22);z-index:6}
/* 레포트 */
.ctitle{font-size:15px;font-weight:600;margin-bottom:2px}
.cbig{font-size:22px;font-weight:600;margin:4px 0 10px}
.bar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--line);margin-bottom:6px}
.cmp{padding:7px 0;border-top:.5px solid var(--line)}
.cmp .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.cmp .b{height:7px;border-radius:3px;margin-bottom:3px;min-width:2px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-bottom:4px}
.legend span{display:flex;align-items:center;gap:4px}
.cols{display:flex;align-items:flex-end;height:150px;gap:4px;margin-top:8px}
.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.cols .c{width:72%;border-radius:4px 4px 0 0;background:#C3CEF0;min-height:2px}
.cols .c.on{background:var(--sav)}
.cols small{font-size:10.5px;color:var(--sub);white-space:nowrap}
.pill{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--sub);white-space:nowrap}
.pill.ok{background:#E2F3EA;color:var(--inc)}
.pill.due{background:#F7EEDA;color:var(--tithe)}
/* 입력 시트 */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
.sheet .top{border-bottom:.5px solid var(--line)}
.sheet .top h1{font-size:17px;text-align:center}
.sheet .main{padding-bottom:40px}
.amt{width:100%;border:none;background:transparent;text-align:right;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 0;outline:none}
.amt::placeholder{color:var(--faint)}
.seg{display:flex;gap:6px;background:var(--line);padding:3px;border-radius:11px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;color:var(--sub);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{width:100%;border:none;border-bottom:.5px solid var(--line2);background:transparent;padding:10px 2px;outline:none}
.sec{font-size:12px;color:var(--sub);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.seg button,.days button{touch-action:manipulation}
.chip{font-size:14px;padding:7px 12px;border-radius:999px;border:.5px solid var(--line2);background:var(--card)}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent}
.chip.add{color:var(--sub);border-style:dashed}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--inc)}
.days{display:flex;gap:4px}
.days button{flex:1;height:36px;border-radius:9px;border:.5px solid var(--line2);background:var(--card);font-size:13px}
.days button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.save{width:100%;height:50px;border-radius:13px;color:#fff;font-size:16px;font-weight:600;margin-top:16px}
.ghost{width:100%;height:46px;border-radius:13px;border:.5px solid var(--line2);font-size:15px;margin-top:8px;background:var(--card)}
.ghost.danger{color:var(--exp)}
.err{color:#C2264F;font-size:13px;min-height:18px;margin-top:8px}
.inline{display:flex;gap:6px;margin-top:8px}
.inline input{flex:1;min-width:0;border:.5px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--card)}
.inline button{padding:0 14px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:6px}
.banner{font-size:12.5px;line-height:1.5;color:#7A5A12;background:#F7EEDA;border-radius:10px;padding:9px 11px;margin-bottom:10px}
.trow{display:flex;align-items:center;gap:8px}
.trow input{flex:1;min-width:0;border:.5px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--card);font-variant-numeric:tabular-nums}
.calc{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5}
.calc b{color:var(--inc);font-weight:600}
.wped{background:var(--bg);border-radius:12px;padding:10px;margin:2px 0 8px}
.banner.nb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:13.5px}
.banner.nb span:first-child{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;z-index:40;white-space:nowrap}
.srow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:.5px solid var(--line)}
.srow:first-of-type{border-top:none}
.srow .t{flex:1;min-width:0;font-size:15px}
.mini{font-size:13px;padding:5px 10px;border-radius:8px;border:.5px solid var(--line2);background:var(--card);white-space:nowrap}
select.field{appearance:none;-webkit-appearance:none}
textarea{width:100%;min-height:120px;border:.5px solid var(--line2);border-radius:10px;padding:8px;background:var(--card);font-size:12px}
@media (prefers-reduced-motion:no-preference){.sheet.in{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<script>
(function(){
"use strict";
// ───────── 기본 데이터 ─────────
const EXP_DEFAULT={
  "생활비":["식사","카페","생필품","옷","미용실","의료"],
  "고정지출":["통신비","교통비","구독료"],
  "관계":["경조사·선물","약속비"],
  "교육":["교재비","강의·자료"],
  "여가":["취미·문화","여행"],
  "헌금":["십일조","감사헌금"],
  "기타":["기타"]
};
const SAV_DEFAULT=["청년미래적금","S&P 500"];
const WP_DEFAULT=["개인정보보호대학원 장기근로","일반대학원 단기근로","비전하우스 일일 당직","단기 하루 근로","장학금"];
const GROUP_ORDER=["생활비","고정지출","관계","교육","여가","기타"];
const SHADES=["var(--exp)","var(--exp2)","var(--exp3)","var(--exp4)","var(--exp5)","var(--exp6)","var(--exp7)"];
const PAYS=["현금","체크카드","신용카드"];
const WD=["일","월","화","수","목","금","토"];

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function freshState(){
  return {v:1,
    workplaces:WP_DEFAULT.map(n=>({id:uid(),name:n,tithe:true,archived:false,pay:"none",rate:0,brk:0,settle:n.includes("당직")?"same":"manual"})),
    exp:JSON.parse(JSON.stringify(EXP_DEFAULT)),
    sav:SAV_DEFAULT.slice(),
    rules:[], tx:[]};
}
let S=freshState();

// ───────── 날짜 유틸 ─────────
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const todayStr=()=>ds(new Date());
const mkey=s=>s.slice(0,7);
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};
const n=v=>Math.round(v).toLocaleString("ko-KR");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let view={tab:"cal",ym:todayStr().slice(0,7),sel:todayStr(),detail:null};

// ───────── 저장소: 클로드 DB(로그인 시) + 이 기기(localStorage) ─────────
const LS="minsom-gagyebu-v1";
let db=null,uidUser=null,storage="local",saving=Promise.resolve(),dirtyMonths=new Set(),dirtySettings=false,saveTimer=null;
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function lsRead(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null;}catch(e){return null;}}
function normalize(x){
  if(!x||typeof x!=="object")return freshState();
  const f=freshState();
  return {v:1,workplaces:(Array.isArray(x.workplaces)?x.workplaces:f.workplaces).map(w=>({pay:"none",rate:0,brk:0,settle:String(w.name||"").includes("당직")?"same":"manual",...w})),exp:x.exp&&typeof x.exp==="object"?x.exp:f.exp,
    sav:Array.isArray(x.sav)?x.sav:f.sav,rules:Array.isArray(x.rules)?x.rules:[],tx:Array.isArray(x.tx)?x.tx:[]};
}
function markDirty(months,settings){
  (months||[]).forEach(m=>dirtyMonths.add(m));
  if(settings)dirtySettings=true;
  lsWrite();
  if(!db)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,500);
}
function flush(){
  if(!db)return;
  const months=[...dirtyMonths];dirtyMonths.clear();
  const doSettings=dirtySettings;dirtySettings=false;
  saving=saving.then(async()=>{
    const col=db.collection("data/users/"+uidUser);
    try{
      if(doSettings)await col.doc("settings").set({v:1,workplaces:S.workplaces,exp:S.exp,sav:S.sav,rules:S.rules});
      for(const m of months){
        const list=S.tx.filter(t=>mkey(t.date)===m);

// ───────── 반복: 날짜가 되면 자동 기록 ─────────
function ruleHits(r,dstr){
  const d=pd(dstr);
  if(r.freq==="week")return (r.days||[]).includes(d.getDay());
  if(r.freq==="month"){
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return d.getDate()===Math.min(r.dom,last);
  }
  return false;
}
function runRules(){
  const today=todayStr();const touched=new Set();let changed=false;
  S.rules.forEach(r=>{
    let from=r.doneThrough?addDays(r.doneThrough,1):r.start;
    if(from<r.start)from=r.start;
    const until=r.end&&r.end<today?r.end:today;
    let guard=0;
    for(let d=from;d<=until&&guard<800;d=addDays(d,1),guard++){
      if(ruleHits(r,d)){
        S.tx.push({id:uid(),date:d,type:r.type,amount:r.amount,name:r.name,cat:r.cat,group:r.group,wp:r.wp||null,pay:r.pay||null,tithe:!!r.tithe,memo:r.memo||"",tin:r.tin||null,tout:r.tout||null,brk:r.brk||0,paidOn:r.type==="수입"&&settleOf(r.wp)==="same"?d:null,ruleId:r.id});
        touched.add(mkey(d));
      }
    }
    if(until>=from){r.doneThrough=until;changed=true;}
  });
  if(changed)markDirty([...touched],true);
}

function payText(w){return (w.settle==="same"?"당일 정산 · ":"")+(w.pay==="hour"&&w.rate?"시급 "+n(w.rate)+(w.brk?" · 휴게 "+w.brk+"분":""):w.pay==="fixed"&&w.rate?"1회 "+n(w.rate):"급여 직접 입력");}
function ruleText(r){
  const w=r.freq==="week"?"매주 "+(r.days||[]).slice().sort().map(d=>WD[d]).join("·"):"매달 "+r.dom+"일";
  return w+" · "+r.start.slice(5).replace("-",".")+"부터"+(r.end?" "+r.end.slice(5).replace("-",".")+"까지":"");
}

  const rep=F.editing?(F.ruleId?`<div class="note">반복으로 기록된 내역이에요. 여기서 고친 내용은 이날 기록에만 적용돼요.</div>`:""):
    `<div class="sec">반복</div><div class="seg">${[["none","안 함"],["week","매주"],["month","매달"]].map(([k,l])=>`<button data-rep="${k}" aria-pressed="${F.repeat===k}">${l}</button>`).join("")}</div>
    ${F.repeat==="week"?`<div class="days" style="margin-top:8px">${WD.map((w,i)=>`<button data-day="${i}" aria-pressed="${F.days.includes(i)}">${w}</button>`).join("")}</div>`:""}
    ${F.repeat==="month"?`<div class="note">매달 ${F.dom}일에 기록돼요. 그달에 ${F.dom}일이 없으면 마지막 날에 기록돼요.</div>`:""}
    ${F.repeat!=="none"?`<label class="chk" style="font-size:14px;margin-top:6px"><span style="flex:none">끝나는 날</span><input type="date" id="sh-end" class="field" style="padding:6px 2px" value="${F.end||""}" min="${F.date}"></label><div class="note">${F.date>todayStr()?"시작일이 되면":"오늘까지 해당하는 날은 바로, 이후로는 날짜가 되면"} 자동으로 기록돼요.</div>`:""}`;
  let del="";

}
function timeHTML(){
  const w=S.workplaces.find(w=>w.id===F.wp);if(!w)return "";
  const calc=calcText(w);
  return `<div class="sec">근무 시간</div>
   <div class="trow"><input type="time" id="sh-tin" value="${F.tin||""}" aria-label="출근 시각"><span>~</span><input type="time" id="sh-tout" value="${F.tout||""}" aria-label="퇴근 시각"></div>
   <div class="trow" style="margin-top:6px"><span class="lbl" style="flex:none">휴게</span><input type="number" inputmode="numeric" id="sh-brk" min="0" step="5" value="${F.brk||0}" aria-label="휴게시간(분)" style="max-width:90px"><span class="lbl">분</span></div>
   <div class="calc num" id="sh-calc">${calc}</div>`;
}
function calcText(w){
  if(w.pay==="fixed")return w.rate?`1회 ${n(w.rate)}`:"설정에서 1회 금액을 정하면 자동으로 채워져요";
  if(w.pay!=="hour"||!w.rate)return "설정 → 직장에서 시급을 정하면 금액이 자동으로 계산돼요";
  const m=workMins(F.tin,F.tout,F.brk);
  return m?`${hm(m)} × ${n(w.rate)} = <b>${n(Math.round(m/60*w.rate))}</b>`:`시급 ${n(w.rate)} · 출근과 퇴근 시각을 넣어 주세요`;
}
function recalc(){
  const w=S.workplaces.find(w=>w.id===F.wp);if(!w)return;
  const ti=$("sh-tin"),to=$("sh-tout"),bk=$("sh-brk");
  if(ti)F.tin=ti.value;if(to)F.tout=to.value;if(bk)F.brk=Math.max(0,+bk.value||0);
  if(w.pay==="hour"&&w.rate){const m=workMins(F.tin,F.tout,F.brk);if(m){F.amountStr=String(Math.round(m/60*w.rate));const a=$("sh-amt");if(a)a.value=n(+F.amountStr);}}
  const c=$("sh-calc");if(c)c.innerHTML=calcText(w);
}
function keepFields(){
  const a=$("sh-amt");if(a)F.amountStr=a.value.replace(/[^0-9]/g,"").slice(0,10);
  const nm=$("sh-name");if(nm)F.name=nm.value;
  const me=$("sh-memo");if(me)F.memo=me.value;
  const ti=$("sh-tithe");if(ti)F.tithe=ti.checked;
  const en=$("sh-end");if(en)F.end=en.value;
  const pc=$("sh-paid");if(pc)F.paidChk=pc.checked;const po=$("sh-paidon");if(po)F.paidOn=po.value;
  const ti2=$("sh-tin");if(ti2)F.tin=ti2.value;const to2=$("sh-tout");if(to2)F.tout=to2.value;const bk=$("sh-brk");if(bk)F.brk=Math.max(0,+bk.value||0);
}
function clearErr(){F.err="";const e=$("sh-err");if(e)e.textContent="";}
function bindSheet(){
  const L=$("layer");
  $("sh-close").onclick=closeSheet;
  const a=$("sh-amt");
  a.oninput=()=>{const raw=a.value.replace(/[^0-9]/g,"").slice(0,10);a.value=raw?n(+raw):"";F.amountStr=raw;};
  L.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{keepFields();if(F.type!==b.dataset.type){F.type=b.dataset.type;F.cat=null;F.group=null;F.wp=null;F.pay=null;F.err="";}drawSheet();});
  L.querySelectorAll("[data-wp]").forEach(b=>b.onclick=()=>{keepFields();F.wp=b.dataset.wp;const w=S.workplaces.find(w=>w.id===F.wp);if(w&&!F.editing){F.tithe=!!w.tithe;F.brk=w.brk||0;if(w.pay==="fixed"&&w.rate)F.amountStr=String(w.rate);}F.err="";drawSheet();recalc();});
  L.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{F.cat=b.dataset.cat;F.group=b.dataset.grp;clearErr();
    const col=F.type==="저축"?"var(--sav)":"var(--exp)";
    L.querySelectorAll("[data-cat]").forEach(x=>{const on=x===b;x.setAttribute("aria-pressed",String(on));x.style.background=on?(x.dataset.grp==="헌금"?"var(--tithe)":col):"";});});
  L.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{F.pay=b.dataset.pay;clearErr();
    L.querySelectorAll("[data-pay]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));});
  L.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{keepFields();F.repeat=b.dataset.rep;drawSheet();});
  L.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{const i=+b.dataset.day;F.days=F.days.includes(i)?F.days.filter(x=>x!==i):[...F.days,i];b.setAttribute("aria-pressed",String(F.days.includes(i)));});
  const aw=$("sh-addwp");if(aw)aw.onclick=()=>{keepFields();F.addWp=true;drawSheet();const i=$("sh-wpname");if(i)i.focus();};
  const ok=$("sh-wpok");if(ok)ok.onclick=()=>{keepFields();const nm=$("sh-wpname").value.trim();if(!nm)return;const w={id:uid(),name:nm,tithe:true,archived:false,pay:"none",rate:0,brk:0,settle:"manual"};S.workplaces.push(w);markDirty([],true);F.wp=w.id;F.tithe=true;F.addWp=false;drawSheet();};
  const pcb=$("sh-paid");if(pcb)pcb.onchange=()=>{keepFields();drawSheet();};
  ["sh-tin","sh-tout","sh-brk"].forEach(id=>{const el=$(id);if(el){el.oninput=recalc;el.onchange=recalc;}});
  $("sh-save").onclick=saveSheet;
  const da=$("del-ask");if(da)da.onclick=()=>{keepFields();F.confirm="delete";drawSheet();};
  const dc=$("del-cancel");if(dc)dc.onclick=()=>{F.confirm=null;drawSheet();};
  const d1=$("del-one");if(d1)d1.onclick=()=>{S.tx=S.tx.filter(t=>t.id!==F.id);markDirty([mkey(F.date)]);closeSheet();toast("삭제했어요");};
  const d2=$("del-after");if(d2)d2.onclick=()=>{
    const r=S.rules.find(r=>r.id===F.ruleId);const months=new Set();
    S.tx=S.tx.filter(t=>{const hit=t.ruleId===F.ruleId&&t.date>=F.date;if(hit)months.add(mkey(t.date));return !hit;});
    if(r){const end=addDays(F.date,-1);if(end<r.start)S.rules=S.rules.filter(x=>x.id!==r.id);else r.end=end;}
    markDirty([...months],true);closeSheet();toast("이날부터 반복을 지웠어요");};
}
function saveSheet(){
  keepFields();
  const amt=+F.amountStr;
  const fail=m=>{F.err=m;$("sh-err").textContent=m;};
  if(!amt)return fail("금액을 입력하세요");
  if(F.type==="수입"&&!F.wp)return fail("직장을 고르세요");
  if(F.type!=="수입"&&!F.cat)return fail("카테고리를 고르세요");
  if(F.type==="지출"&&!F.pay)return fail("결제수단을 고르세요");
  if(F.repeat==="week"&&!F.days.length)return fail("반복할 요일을 하나 이상 고르세요");
  const wp=S.workplaces.find(w=>w.id===F.wp);
  const rec={type:F.type,amount:amt,name:F.name.trim(),memo:F.memo.trim(),
    cat:F.type==="수입"?(wp?wp.name:""):F.cat, group:F.type==="수입"?"수입":F.type==="저축"?"저축":F.group,
    wp:F.type==="수입"?F.wp:null, pay:F.type==="지출"?F.pay:null, tithe:F.type==="수입"?!!F.tithe:false,
    tin:F.type==="수입"&&F.tin?F.tin:null, tout:F.type==="수입"&&F.tout?F.tout:null, brk:F.type==="수입"?(F.brk||0):0};
  if(F.type==="수입"&&wp&&wp.tithe!==rec.tithe){wp.tithe=rec.tithe;markDirty([],true);} // 마지막 선택 기억
  if(F.editing){
    const t=S.tx.find(t=>t.id===F.id);if(t){Object.assign(t,rec);
      if(t.type!=="수입")t.paidOn=null;else if(settleOf(t.wp)==="same")t.paidOn=t.date;else t.paidOn=F.paidChk?(F.paidOn||todayStr()):null;}
    markDirty([mkey(F.date)]);closeSheet();toast("수정했어요");return;
  }
  if(F.repeat!=="none"){
    S.rules.push({id:uid(),...rec,freq:F.repeat,days:F.days.slice(),dom:F.dom,start:F.date,end:F.end||null,doneThrough:null});
    const future=F.date>todayStr();markDirty([],true);runRules();closeSheet();
    toast(future?"반복을 등록했어요. 날짜가 되면 기록돼요":"반복으로 저장했어요");return;
  }
  S.tx.push({id:uid(),date:F.date,...rec,paidOn:F.type==="수입"&&settleOf(F.wp)==="same"?F.date:null,ruleId:null});
  markDirty([mkey(F.date)]);closeSheet();toast("저장했어요");
}
function closeSheet(){$("layer").innerHTML="";F=null;render();}

let tt=null;
function toast(msg){let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;},1900);}

main.addEventListener("click",e=>{
  const day=e.target.closest("[data-date]");
  if(day){const s=day.dataset.date;view.sel=s;if(mkey(s)!==view.ym)view.ym=mkey(s);render();return;}
  const tr=e.target.closest("[data-tx]");
  if(tr){const t=S.tx.find(t=>t.id===tr.dataset.tx);if(t)openSheet(t);return;}
  const op=e.target.closest("[data-open]");if(op){openDetail(op.dataset.open);return;}
  const tp=e.target.closest("[data-tpay]");if(tp){view.tpay=tp.dataset.tpay;main.querySelectorAll("[data-tpay]").forEach(b=>b.setAttribute("aria-pressed",String(b===tp)));return;}
  if(e.target.closest("#tithe-give")){const ym=view.ym,st=titheState(ym);if(st.left<=0)return;const day=lastSunday(ym);
    S.tx.push({id:uid(),date:day,type:"지출",amount:st.left,name:"십일조",cat:"십일조",group:"헌금",wp:null,pay:view.tpay||"현금",tithe:false,memo:"",ruleId:null,paidOn:null});
    markDirty([mkey(day)]);render();const d=pd(day);toast((d.getMonth()+1)+"월 "+d.getDate()+"일에 십일조 "+n(st.left)+"을 기록했어요");return;}
  const gp=e.target.closest("[data-gopick]");if(gp){view.tab="rep";view.detail=null;view.pick=gp.dataset.gopick==="1";view.ym=mkey(todayStr());render();pickSum();main.scrollTop=0;return;}
  if(e.target.closest("#pick-open")){view.pick=!view.pick;render();if(view.pick)pickSum();return;}
  if(e.target.id==="pick-ok"){const ym=view.ym,day=ym===mkey(todayStr())?todayStr():ym+"-"+pad(new Date(+ym.slice(0,4),+ym.slice(5),0).getDate());
    const months=new Set();main.querySelectorAll("[data-pick]").forEach(x=>{const t=S.tx.find(t=>t.id===x.dataset.pick);if(!t)return;
      if(x.checked&&!t.paidOn){t.paidOn=day;months.add(mkey(t.date));}else if(!x.checked&&t.paidOn){t.paidOn=null;months.add(mkey(t.date));}});
    view.pick=false;markDirty([...months]);render();toast("이번 달 십일조를 다시 계산했어요");return;}
  const we=e.target.closest("[data-wedit]");if(we){view.wpEdit=view.wpEdit===we.dataset.wedit?null:we.dataset.wedit;view.wpPay=null;view.wpSet=null;render();return;}
  const wsb=e.target.closest("[data-wset]");if(wsb){view.wpSet=wsb.dataset.wset;main.querySelectorAll("[data-wset]").forEach(b=>b.setAttribute("aria-pressed",String(b===wsb)));return;}
  const wpb=e.target.closest("[data-wpay]");if(wpb){view.wpPay=wpb.dataset.wpay;const keepRate=$("wp-rate")?$("wp-rate").value:null;render();if(keepRate!=null&&$("wp-rate"))$("wp-rate").value=keepRate;return;}
  if(e.target.id==="wp-save"){const w=S.workplaces.find(w=>w.id===view.wpEdit);if(w){w.pay=view.wpPay||w.pay;const r=$("wp-rate");w.rate=r?Math.max(0,Math.round(+r.value||0)):0;w.brk=Math.max(0,Math.round(+$("wp-brk").value||0));if(view.wpSet){w.settle=view.wpSet;fixPaid();}markDirty([...new Set(S.tx.map(t=>mkey(t.date)))],true);view.wpEdit=null;view.wpPay=null;view.wpSet=null;render();toast("급여를 저장했어요");}return;}
  const wa=e.target.closest("[data-warch]");if(wa){const w=S.workplaces.find(w=>w.id===wa.dataset.warch);if(w){w.archived=true;markDirty([],true);render();toast("보관했어요");}return;}
  const wr=e.target.closest("[data-wrest]");if(wr){const w=S.workplaces.find(w=>w.id===wr.dataset.wrest);if(w){w.archived=false;markDirty([],true);render();}return;}
  const rs=e.target.closest("[data-rstop]");if(rs){const r=S.rules.find(r=>r.id===rs.dataset.rstop);if(r){r.end=todayStr();S.rules=S.rules.filter(x=>x!==r);markDirty([],true);render();toast("반복을 멈췄어요. 지난 기록은 남아 있어요");}return;}
  if(e.target.id==="add-wp"){const i=$("new-wp"),nm=i.value.trim();if(!nm)return;S.workplaces.push({id:uid(),name:nm,tithe:true,archived:false});markDirty([],true);render();toast("직장을 추가했어요");return;}
  if(e.target.id==="add-cat"){const g=$("new-cat-g").value,nm=$("new-cat").value.trim();if(!nm)return;
    if(g==="__sav"){if(!S.sav.includes(nm))S.sav.push(nm);}else{S.exp[g]=S.exp[g]||[];if(!S.exp[g].includes(nm))S.exp[g].push(nm);}
    markDirty([],true);render();toast("카테고리를 추가했어요");return;}
  if(e.target.id==="exp-btn"){exportBackup();return;}
  if(e.target.id==="imp-yes"){if(pendingImport){S=normalize(pendingImport);pendingImport=null;const months=new Set(S.tx.map(t=>mkey(t.date)));
    if(db){// 기존 월 문서 정리 후 다시 저장
      allMonthsEver.forEach(m=>months.add(m));}
    markDirty([...months],true);runRules();render();toast("백업을 불러왔어요");}return;}
  if(e.target.id==="imp-no"){pendingImport=null;$("bk-area").innerHTML="";return;}
  if(e.target.id==="copy-json"){const ta=$("bk-json");navigator.clipboard?.writeText(ta.value).then(()=>toast("복사했어요"),()=>{ta.select();toast("길게 눌러 복사하세요");});return;}
});
main.addEventListener("change",e=>{
  if(e.target.dataset.pick){pickSum();return;}
  if(e.target.dataset.wtithe){const w=S.workplaces.find(w=>w.id===e.target.dataset.wtithe);if(w){w.tithe=e.target.checked;markDirty([],true);}}
  if(e.target.id==="imp-file"){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.tx))throw 0;pendingImport=x;
      $("bk-area").innerHTML=`<div class="note" style="margin-top:10px">백업에는 기록 ${x.tx.length}건이 있어요. 불러오면 지금 기록 ${S.tx.length}건이 백업 내용으로 바뀌어요.</div><button class="ghost danger" id="imp-yes">바꾸기</button><button class="ghost" id="imp-no">취소</button>`;}
      catch(err){$("bk-area").innerHTML=`<div class="err">이 파일은 가계부 백업이 아니에요. 내보내기로 만든 .json 파일을 고르세요.</div>`;}};
    r.readAsText(f);e.target.value="";}
});
let pendingImport=null;
const allMonthsEver=new Set();
async function exportBackup(){
  const json=JSON.stringify(S);
  const name="가계부-백업-"+todayStr()+".json";
  const blob=new Blob([json],{type:"application/json"});
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast("백업 파일을 저장했어요");return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("백업 파일을 내려받았어요");return;}catch(e){}
  $("bk-area").innerHTML=`<div class="note" style="margin-top:10px">파일로 저장할 수 없어요. 아래 내용을 복사해서 메모 앱에 붙여 넣어 두세요.</div><textarea id="bk-json" readonly aria-label="백업 내용">${esc(json)}</textarea><button class="ghost" id="copy-json">복사</button>`;
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;view.detail=null;main.scrollTop=0;render();});
$("prev").onclick=()=>{view.pick=false;if(view.detail){view.detail=null;render();return;}view.ym=prevYm(view.ym);view.sel=view.ym+"-01";if(mkey(todayStr())===view.ym)view.sel=todayStr();render();};
$("next").onclick=()=>{view.pick=false;view.ym=nextYm(view.ym);view.sel=view.ym+"-01";if(mkey(todayStr())===view.ym)view.sel=todayStr();render();};
$("fab").onclick=()=>openSheet(null);

// 스와이프로 달 넘기기 (달력)
let sx=null,sy=null;
main.addEventListener("touchstart",e=>{if(view.tab!=="cal"||view.detail)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
main.addEventListener("touchend",e=>{if(sx==null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){(dx<0?$("next"):$("prev")).click();}},{passive:true});

// ───────── 시작 ─────────
const saved=lsRead();if(saved)S=normalize(saved);
S.tx.forEach(t=>allMonthsEver.add(mkey(t.date)));
fixPaid();runRules();render();
connect().then(()=>{S.tx.forEach(t=>allMonthsEver.add(mkey(t.date)));});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const before=S.tx.length;runRules();if(S.tx.length!==before)render();}});
})();
</script>

</body></html>
